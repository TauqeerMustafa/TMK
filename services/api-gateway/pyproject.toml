[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmk-api-gateway"
version = "2.4.0"
description = "TMK High-Throughput API Gateway and Security Proxy"
authors = [{ name = "Tauqeer Mustafa", email = "mr.tauqeermustafa@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
